name: Build Mod Jar
 
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
 
      - name: Install Gradle 1.12 (required by ForgeGradle 1.2 for MC 1.7.10)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-1.12-bin.zip
          unzip -q gradle-1.12-bin.zip
          echo "$PWD/gradle-1.12/bin" >> "$GITHUB_PATH"
 
      - name: Build with ForgeGradle
        run: gradle setupDecompWorkspace build --no-daemon --stacktrace
 
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: veinminer-jar
          path: build/libs/*.jar
 
