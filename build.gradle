buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://files.minecraftforge.net/maven" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://jitpack.io" }
    }
    dependencies {
        // Upstream ForgeGradle 1.2 is hardcoded to a Mojang S3 endpoint that
        // was retired in 2022, which breaks setupDecompWorkspace/getAssetsIndex
        // for everyone (not specific to this project). The GTNewHorizons fork
        // patches that endpoint and is a drop-in replacement.
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'

version = "1.0.0"
group = "com.veinminer"
archivesBaseName = "veinminer"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

// Railcraft is only referenced by registry name at runtime (see
// BlockWhitelist), so no Railcraft dependency is required to compile
// or run this mod.

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
